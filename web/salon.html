<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #2a2622;
    --muted: #8a8378;
    --accent: #7a4b3a;
    --bubble: #ffffff;
    --border: #e2ddd4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --fg: #ece7de;
      --muted: #8a8378;
      --accent: #d9a074;
      --bubble: #2a2622;
      --border: #3a352e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  header button {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--fg);
  }
  header button:disabled {
    opacity: 0.5;
  }

  #setup {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  #setup label {
    font-size: 13px;
    color: var(--muted);
  }
  #setup input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bubble);
    color: var(--fg);
    font-size: 15px;
  }
  #setup button, #chat-form button {
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  #setup button:disabled, #chat-form button:disabled {
    opacity: 0.5;
  }
  #setup-error {
    color: #c0392b;
    font-size: 13px;
    min-height: 16px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--bubble);
    border: 1px solid var(--border);
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg .speaker {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
    display: block;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    border: none;
    background: none;
    text-align: center;
  }
  .passed {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }
  .loading {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
  .replay-btn {
    margin-top: 6px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }

  #chat-form {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  #chat-form textarea {
    flex: 1;
    resize: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bubble);
    color: var(--fg);
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 140px;
    overflow-y: auto;
  }
  #chat-form textarea:disabled {
    opacity: 0.6;
  }
  #chat-form button {
    flex-shrink: 0;
    padding: 0 18px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="setup">
  <h1 style="margin-bottom: 4px;">Start a session</h1>
  <label for="server-url">Server address</label>
  <input id="server-url" placeholder="http://localhost:8080" value="http://localhost:8080">

  <label for="characters">Characters (comma-separated folder names)</label>
  <input id="characters" placeholder="hume, ebennet">

  <label for="reading">Reading slug (optional)</label>
  <input id="reading" placeholder="decl">

  <label style="display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="voice-toggle">
    Voice replies
  </label>

  <button id="start-btn">Start</button>
  <div id="setup-error"></div>
</div>

<div id="chat" class="hidden" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
  <header>
    <h1 id="chat-title">Salon</h1>
    <button id="pause-btn" style="display: none;">⏸</button>
    <button id="end-btn">End session</button>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <textarea id="chat-input" placeholder="Say something..." rows="1"></textarea>
    <button type="submit">Send</button>
  </form>
</div>

<script>
  const setupView = document.getElementById('setup');
  const chatView = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const chatTitle = document.getElementById('chat-title');
  const setupError = document.getElementById('setup-error');
  const startBtn = document.getElementById('start-btn');
  const endBtn = document.getElementById('end-btn');
  const sendBtn = chatForm.querySelector('button');

  let serverUrl = '';
  let sessionId = null;

  const pauseBtn = document.getElementById('pause-btn');
  let audioQueue = []; // array of { audio, speaker }
  let currentAudio = null;
  let currentSpeaker = null;

  function updateMediaSession(speaker) {
    if (!('mediaSession' in navigator)) return;

    navigator.mediaSession.metadata = new MediaMetadata({
      title: speaker || 'Salon',
      artist: chatTitle.textContent,
    });
    navigator.mediaSession.playbackState = 'playing';

    navigator.mediaSession.setActionHandler('play', () => {
      if (currentAudio) {
        currentAudio.play();
        pauseBtn.textContent = '⏸';
        navigator.mediaSession.playbackState = 'playing';
      }
    });
    navigator.mediaSession.setActionHandler('pause', () => {
      if (currentAudio) {
        currentAudio.pause();
        pauseBtn.textContent = '▶';
        navigator.mediaSession.playbackState = 'paused';
      }
    });
    // No prev/next track concept here — a "track" is one reply.
    navigator.mediaSession.setActionHandler('previoustrack', null);
    navigator.mediaSession.setActionHandler('nexttrack', null);
  }

  function queueAudio(audioEl, speaker) {
    audioQueue.push({ audio: audioEl, speaker });
    if (!currentAudio) playNext();
  }

  function playNext() {
    if (audioQueue.length === 0) {
      currentAudio = null;
      currentSpeaker = null;
      pauseBtn.style.display = 'none';
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'none';
      }
      return;
    }
    const next = audioQueue.shift();
    currentAudio = next.audio;
    currentSpeaker = next.speaker;
    currentAudio.onended = () => { if (currentAudio) playNext(); };
    currentAudio.currentTime = 0;
    currentAudio.play();
    pauseBtn.style.display = 'inline-block';
    pauseBtn.textContent = '⏸';
    updateMediaSession(currentSpeaker);
  }

  pauseBtn.addEventListener('click', () => {
    if (!currentAudio) return;
    if (currentAudio.paused) {
      currentAudio.play();
      pauseBtn.textContent = '⏸';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    } else {
      currentAudio.pause();
      pauseBtn.textContent = '▶';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    }
  });

  function replayAudio(audioEl, speaker) {
    if (currentAudio) currentAudio.pause();
    audioQueue = [];
    currentAudio = audioEl;
    currentSpeaker = speaker;
    audioEl.onended = () => {
      currentAudio = null;
      currentSpeaker = null;
      pauseBtn.style.display = 'none';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
    };
    audioEl.currentTime = 0;
    audioEl.play();
    pauseBtn.style.display = 'inline-block';
    pauseBtn.textContent = '⏸';
    updateMediaSession(speaker);
  }

  function addBubble(speaker, content, cls, audioEl) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    if (speaker) {
      const s = document.createElement('span');
      s.className = 'speaker';
      s.textContent = speaker;
      div.appendChild(s);
    }
    div.appendChild(document.createTextNode(content));

    if (audioEl) {
      const replayBtn = document.createElement('button');
      replayBtn.className = 'replay-btn';
      replayBtn.type = 'button';
      replayBtn.textContent = '▶ replay';
      replayBtn.addEventListener('click', () => replayAudio(audioEl, speaker));
      div.appendChild(document.createElement('br'));
      div.appendChild(replayBtn);
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addSystem(text) {
    addBubble(null, text, 'system');
  }

  function addLoading() {
    const div = document.createElement('div');
    div.className = 'loading';
    div.textContent = '...';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  startBtn.addEventListener('click', async () => {
    if (startBtn.disabled) return;
    setupError.textContent = '';
    serverUrl = document.getElementById('server-url').value.trim().replace(/\/$/, '');
    const chars = document.getElementById('characters').value
      .split(',').map(s => s.trim()).filter(Boolean);
    const reading = document.getElementById('reading').value.trim();

    if (!serverUrl || chars.length === 0) {
      setupError.textContent = 'Server address and at least one character are required.';
      return;
    }

    startBtn.disabled = true;

    try {
      const res = await fetch(serverUrl + '/session/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ characters: chars, reading: reading })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setupError.textContent = err.error || ('Server returned ' + res.status);
        startBtn.disabled = false;
        return;
      }
      const data = await res.json();
      sessionId = data.session_id;

      localStorage.setItem('salon_session_id', sessionId);
      localStorage.setItem('salon_characters', JSON.stringify(chars));
      localStorage.setItem('salon_server_url', serverUrl);

      chatTitle.textContent = chars.join(' · ');
      setupView.classList.add('hidden');
      chatView.classList.remove('hidden');
      addSystem('Session started.');
      chatInput.focus();
    } catch (e) {
      setupError.textContent = 'Could not reach server: ' + e.message;
      startBtn.disabled = false;
    }
  });

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (sendBtn.disabled) return;
    const text = chatInput.value.trim();
    if (!text || !sessionId) return;

    sendBtn.disabled = true;
    addBubble(null, text, 'user');
    chatInput.value = '';
    const loadingEl = addLoading();

    const voiceEnabled = document.getElementById('voice-toggle').checked;

    try {
      const res = await fetch(serverUrl + '/session/' + sessionId + '/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, voice: voiceEnabled })
      });
      loadingEl.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addSystem('Error: ' + (err.error || res.status));
        return;
      }

      const data = await res.json();

      (data.replies || []).forEach(r => {
        let audioEl = null;
        if (r.audio_base64) {
          audioEl = new Audio('data:audio/mpeg;base64,' + r.audio_base64);
        }
        addBubble(r.speaker, r.content, 'character', audioEl);
        if (audioEl) queueAudio(audioEl, r.speaker);
      });

      (data.passed || []).forEach(name => {
        const div = document.createElement('div');
        div.className = 'passed';
        div.textContent = '(' + name + ' passes)';
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (err) {
      loadingEl.remove();
      addSystem('Could not reach server: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      chatInput.focus();
    }
  });

  // Allow enter to send if on desktop, if on mobile, enter is newline.
  const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

  if (!isTouchDevice) {
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });
  }

  endBtn.addEventListener('click', async () => {
    if (endBtn.disabled) return;
    if (!sessionId) return;
    if (!confirm('End this session? This closes it out and updates character memory.')) return;

    endBtn.disabled = true;
    const idToEnd = sessionId;
    sessionId = null; // clear immediately so nothing else can act on this session

    try {
      const res = await fetch(serverUrl + '/session/' + idToEnd + '/end', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      const updated = (data.updated || []);
      addSystem(updated.length
        ? 'Session ended. Updated: ' + updated.join(', ')
        : 'Session ended. Nothing notable to record.');
      chatInput.disabled = true;
      sendBtn.disabled = true;

      localStorage.removeItem('salon_session_id');
      localStorage.removeItem('salon_characters');
      localStorage.removeItem('salon_server_url');
    } catch (e) {
      addSystem('Could not reach server to end session: ' + e.message);
      endBtn.disabled = false; // let them retry if it genuinely failed
      sessionId = idToEnd; // restore, since the session might still be alive server-side
    }
  });

  window.addEventListener('DOMContentLoaded', async () => {
    const savedId = localStorage.getItem('salon_session_id');
    const savedUrl = localStorage.getItem('salon_server_url');
    const savedChars = localStorage.getItem('salon_characters');

    if (savedId && savedUrl) {
      sessionId = savedId;
      serverUrl = savedUrl;
      const chars = savedChars ? JSON.parse(savedChars) : [];
      chatTitle.textContent = chars.join(' · ') || 'Salon';
      setupView.classList.add('hidden');
      chatView.classList.remove('hidden');

      try {
        const res = await fetch(serverUrl + '/session/' + sessionId + '/transcript');
        if (res.ok) {
          const data = await res.json();
          (data.transcript || []).forEach(t => {
            const cls = t.speaker === 'User' ? 'user' : 'character';
            addBubble(t.speaker === 'User' ? null : t.speaker, t.content, cls);
          });
          addSystem('Resumed session.');
        } else {
          addSystem('Could not find that session on the server — it may have ended or the server restarted.');
          localStorage.removeItem('salon_session_id');
          localStorage.removeItem('salon_characters');
          localStorage.removeItem('salon_server_url');
          sessionId = null;
          chatView.classList.add('hidden');
          setupView.classList.remove('hidden');
        }
      } catch (e) {
        addSystem('Could not reach server to resume: ' + e.message);
      }
    }
  });

</script>

</body>
</html>
